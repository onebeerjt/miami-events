<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7">
<title>Miami — What's On</title>
<style>
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --ink: #1C1C1E;
  --label2: rgba(60, 60, 67, 0.6);
  --label3: rgba(60, 60, 67, 0.35);
  --blue: #007AFF;
  --green: #34C759;
  --orange: #FF9500;
  --red: #FF3B30;
  --hairline: rgba(60, 60, 67, 0.12);
  --card-border: rgba(0, 0, 0, 0.06);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.05);
  --spring: cubic-bezier(0.32, 0.72, 0, 1);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font-family: inherit; }

/* ---------- nav bar (iOS style) ---------- */
.navbar {
  position: sticky; top: 0; z-index: 60;
  padding-top: var(--sat);
  background: rgba(255, 255, 255, 0.82);
  -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8);
  border-bottom: 0.5px solid var(--hairline);
}
.navbar .bar {
  height: 52px; max-width: 560px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; position: relative;
}
.navbar h1 {
  position: absolute; left: 0; right: 0; text-align: center;
  font-size: 17px; font-weight: 600; letter-spacing: -0.4px; pointer-events: none;
}
.navbtn {
  border: 0; background: none; color: var(--blue); cursor: pointer;
  width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%;
  transition: transform 0.15s var(--spring), opacity 0.15s;
  position: relative; z-index: 1;
}
.navbtn:active { transform: scale(0.88); opacity: 0.6; }
.navbtn.spinning svg { animation: rot 0.9s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }

/* ---------- pull to refresh ---------- */
#ptr { height: 0; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; transition: height 0.18s ease-out; }
#ptrSpin { color: var(--label3); padding-bottom: 10px; display: grid; place-items: center; }
#ptrSpin.spinning svg { animation: rot 0.9s linear infinite; }
.ptr-ring { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid rgba(60,60,67,0.18); border-top-color: rgba(60,60,67,0.55); animation: rot 0.8s linear infinite; }

/* ---------- content ---------- */
.app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(var(--sab) + 108px); }

/* large title */
.titleblock { padding: 14px 4px 12px; }
.titleblock h2 { font-size: 34px; font-weight: 700; letter-spacing: -0.8px; line-height: 1.1; }
.titleblock p { font-size: 15px; color: var(--label2); margin-top: 3px; font-weight: 400; }
.titleblock p b { color: var(--ink); font-weight: 600; }

/* iOS search bar */
.searchbar {
  display: flex; align-items: center; gap: 7px;
  background: #E8E8ED; border-radius: 10px;
  padding: 8px 10px; margin-bottom: 14px;
  color: var(--label2);
}
.searchbar input {
  flex: 1; background: none; border: 0; outline: 0;
  font-size: 17px; color: var(--ink); font-weight: 400;
}
.searchbar input::placeholder { color: var(--label2); }

/* native segmented control */
.seg {
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: #E4E4E9; border-radius: 9px; padding: 2px;
  margin-bottom: 14px; position: relative;
}
.seg button {
  border: 0; background: none; color: var(--ink);
  font-size: 13px; font-weight: 500; padding: 7px 0; border-radius: 7px;
  cursor: pointer; position: relative; z-index: 1;
  transition: font-weight 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.seg button.on { font-weight: 600; }
.seg .thumb {
  position: absolute; top: 2px; bottom: 2px; border-radius: 7px; z-index: 0;
  background: #fff;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 1px 1px rgba(0,0,0,0.08);
  transition: left 0.28s var(--spring), width 0.28s var(--spring);
}

/* category chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 2px 14px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  border: 0; background: #E8E8ED; color: var(--ink);
  font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 999px;
  cursor: pointer; transition: transform 0.15s var(--spring), background 0.2s, color 0.2s;
}
.chip svg { color: var(--label2); }
.chip:active { transform: scale(0.94); }
.chip.on { background: var(--blue); color: #fff; }
.chip.on svg { color: #fff; }

/* toolbar */
.toolbar { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 10px; }
.count { font-size: 13px; color: var(--label2); font-weight: 400; }
.sort { display: flex; gap: 2px; background: none; }
.sort button {
  border: 0; background: none; color: var(--label2); cursor: pointer;
  font-size: 13px; font-weight: 600; padding: 6px 9px; border-radius: 8px;
  display: inline-flex; align-items: center; gap: 4px;
  transition: color 0.15s;
}
.sort button.on { color: var(--blue); }

/* ---------- App Store "Today" hero ---------- */
.hero-label {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.9px;
  color: var(--label2); padding: 2px 4px 8px; text-transform: uppercase;
}
.hero-card {
  position: relative; border-radius: 18px; overflow: hidden; cursor: pointer;
  background: var(--card); border: 0.5px solid var(--card-border);
  box-shadow: var(--shadow);
  transition: transform 0.25s var(--spring);
  animation: rise 0.45s var(--spring) backwards;
  margin-bottom: 16px;
}
.hero-card:active { transform: scale(0.98); }
.hero-card .img { position: relative; height: 230px; overflow: hidden; background: #E8E8ED; }
.hero-card .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-card .img::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.12) 55%, transparent 80%);
}
.hero-card .overlay { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 18px; z-index: 2; }
.hero-card .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: rgba(255,255,255,0.85); text-transform: uppercase; margin-bottom: 4px; }
.hero-card h3 { font-size: 25px; font-weight: 800; letter-spacing: -0.5px; color: #fff; line-height: 1.15; }
.hero-card .sub { font-size: 14px; color: rgba(255,255,255,0.85); margin-top: 4px; font-weight: 500; }
.hero-card .foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
}
.price { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
.price small { font-weight: 400; color: var(--label2); font-size: 12px; }
.price .free { color: var(--green); }
.src { font-size: 11px; color: var(--label3); font-weight: 500; margin-top: 2px; }

/* GET button — App Store style */
.getbtn {
  border: 0; cursor: pointer;
  background: var(--blue); color: #fff;
  font-size: 15px; font-weight: 700; letter-spacing: -0.2px;
  padding: 7px 22px; border-radius: 999px;
  transition: transform 0.15s var(--spring), opacity 0.15s;
}
.getbtn:active { transform: scale(0.93); opacity: 0.85; }

/* ---------- event cards ---------- */
.feed { display: grid; gap: 12px; }
.card {
  position: relative; border-radius: 14px; overflow: hidden; cursor: pointer;
  background: var(--card); border: 0.5px solid var(--card-border);
  box-shadow: var(--shadow);
  transition: transform 0.25s var(--spring);
  animation: rise 0.45s var(--spring) backwards;
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.card:active { transform: scale(0.98); }
.card .img { position: relative; height: 164px; overflow: hidden; background: #E8E8ED; }
.card .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .body { padding: 13px 15px 13px; }
.card h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.4px; line-height: 1.3; margin-bottom: 5px; }
.meta { display: grid; gap: 3px; font-size: 13px; color: var(--label2); font-weight: 400; margin-bottom: 11px; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta svg { color: var(--label3); flex: none; }
.card .foot {
  display: flex; align-items: center; justify-content: space-between;
  border-top: 0.5px solid var(--hairline); padding-top: 11px;
}
.hotflag {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
  color: var(--orange); margin-bottom: 5px;
}

/* artwork fallback — clean light illustration */
.art {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
}
.art .art-ic { opacity: 0.9; }
.art .art-venue {
  font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
  color: rgba(60, 60, 67, 0.55); max-width: 80%; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* skeleton */
.skel { border-radius: 14px; overflow: hidden; background: var(--card); border: 0.5px solid var(--card-border); }
.skel .im { height: 164px; background: linear-gradient(100deg, #EDEDF2 40%, #F7F7FA 50%, #EDEDF2 60%); background-size: 200% 100%; animation: sh 1.4s infinite; }
.skel .ln { height: 13px; border-radius: 6px; margin: 14px 15px 0; background: #EDEDF2; }
.skel .ln:last-child { margin-bottom: 15px; width: 55%; }
@keyframes sh { to { background-position: -200% 0; } }

/* empty + error states */
.state { text-align: center; padding: 64px 32px; }
.state .state-ic { color: #C7C7CC; margin-bottom: 14px; display: flex; justify-content: center; }
.state h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 6px; }
.state p { font-size: 15px; color: var(--label2); line-height: 1.45; }
.state .bluebtn { margin-top: 18px; }

/* blue pill button */
.bluebtn {
  border: 0; cursor: pointer; background: var(--blue); color: #fff;
  font-size: 16px; font-weight: 600; padding: 12px 28px; border-radius: 999px;
  transition: transform 0.15s var(--spring), opacity 0.15s;
  display: inline-flex; align-items: center; gap: 7px;
}
.bluebtn:active { transform: scale(0.95); opacity: 0.85; }

/* ---------- tab bar (iOS native) ---------- */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  padding-bottom: var(--sab);
  background: rgba(255, 255, 255, 0.86);
  -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8);
  border-top: 0.5px solid var(--hairline);
}
.tabbar .row { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); }
.tab {
  border: 0; background: none; color: var(--label3); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 500; letter-spacing: 0.1px; padding: 8px 0 7px;
  transition: color 0.15s, transform 0.15s var(--spring);
}
.tab:active { transform: scale(0.92); }
.tab.on { color: var(--blue); }

/* ---------- detail sheet (iOS modal) ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 95; max-width: 560px; margin: 0 auto;
  max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain;
  border-radius: 14px 14px 0 0; background: var(--bg);
  transform: translateY(105%); transition: transform 0.42s var(--spring);
  box-shadow: 0 -12px 48px rgba(0,0,0,0.18);
  padding-bottom: calc(var(--sab) + 26px);
}
.sheet.on { transform: translateY(0); }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: rgba(60,60,67,0.3); margin: 8px auto 0; }
.sheet .hero { height: 240px; position: relative; margin: 10px 0 0; overflow: hidden; background: #E8E8ED; }
.sheet .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sheet .closebtn {
  position: absolute; top: 12px; right: 12px; z-index: 3;
  width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer;
  background: rgba(120,120,128,0.55); color: #fff;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  display: grid; place-items: center;
  transition: transform 0.15s var(--spring);
}
.sheet .closebtn:active { transform: scale(0.88); }
.sheet .content { padding: 16px 16px 0; }
.sheet h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.2; margin-bottom: 14px; padding: 0 4px; }

/* grouped info rows — Settings style */
.group { background: var(--card); border-radius: 12px; overflow: hidden; margin-bottom: 16px; border: 0.5px solid var(--card-border); }
.grow { display: flex; gap: 12px; align-items: center; padding: 11px 14px; }
.grow + .grow { border-top: 0.5px solid var(--hairline); }
.gic {
  flex: none; width: 30px; height: 30px; border-radius: 7px;
  display: grid; place-items: center; color: #fff;
}
.grow b { display: block; font-size: 16px; font-weight: 400; letter-spacing: -0.3px; }
.grow span { font-size: 13px; color: var(--label2); }

.sheet .bigtix {
  width: 100%; border: 0; cursor: pointer;
  background: var(--blue); color: #fff;
  font-size: 17px; font-weight: 600; letter-spacing: -0.3px;
  padding: 15px; border-radius: 14px; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  transition: transform 0.15s var(--spring), opacity 0.15s;
}
.sheet .bigtix:active { transform: scale(0.98); opacity: 0.88; }
.sheet .btnrow { display: flex; gap: 10px; margin-bottom: 14px; }
.sheet .sysbtn {
  flex: 1; border: 0; cursor: pointer;
  background: #E8E8ED; color: var(--blue);
  font-size: 16px; font-weight: 600; padding: 12px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  transition: transform 0.15s var(--spring), opacity 0.15s;
}
.sheet .sysbtn:active { transform: scale(0.97); opacity: 0.8; }
.sheet .sysbtn.saved { color: var(--ink); }
.sheet .src-note { text-align: center; font-size: 12px; color: var(--label3); }

/* saved view: hide filters */
body.saved-view .filters { display: none; }
.filters { transition: opacity 0.2s; }
</style>
</head>
<body>

<nav class="navbar"><div class="bar">
  <div style="width:36px"></div>
  <h1>Miami</h1>
  <button class="navbtn" id="refreshBtn" aria-label="Refresh"></button>
</div></nav>

<div id="ptr"><div id="ptrSpin"><div class="ptr-ring"></div></div></div>

<div class="app">
  <div class="titleblock">
    <h2>Miami</h2>
    <p><span id="dateline">What's on</span> · <b id="liveCount">···</b></p>
  </div>

  <div class="filters">
    <div class="searchbar">
      <span id="searchIc"></span>

    </div>

    <div class="seg" id="seg">

      <button data-r="tonight">Tonight</button>

    <div class="chips" id="pills"></div>

    <div class="toolbar">
      <div class="count" id="count"></div>
      <div class="sort" id="sort"></div>

  <div class="feed" id="feed"></div>
</div>

<nav class="tabbar"><div class="row">
  <button class="tab on" data-t="events" id="tabEvents"><span>Events</span></button>
  <button class="tab" data-t="saved" id="tabSaved"><span>Saved</span></button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>

<script>

  arts:      ["#F6E4F7", "#AF52DE"],
  nightlife: ["#E8E6FF", "#5856D6"]
};
const CAT_ICON = { music: "music", sports: "trophy", arts: "palette", nightlife: "moon" };

let EVENTS = [];
const smartRange = () => { const d = new Date().getDay(); return (d === 5 || d === 6) ? "tonight" : "week"; };

let saved = new Set(JSON.parse(localStorage.getItem("mia-saved") || "[]"));

  ["all", "All", "spark"], ["music", "Music", "music"], ["sports", "Sports", "trophy"],

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => new Date(iso).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
const fmtTime = iso => new Date(iso).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
const dayStart = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const inRange = (iso, r) => {
  const now = new Date(), t = new Date(iso), start = dayStart(now), d = now.getDay();
  if (isNaN(t) || t < start) return false;
  if (r === "tonight") return t < new Date(start.getTime() + 864e5);
  if (r === "weekend") {
    let from, to;
    if (d === 6) { from = start; to = new Date(start.getTime() + 2 * 864e5); }
    else if (d === 0) { from = start; to = new Date(start.getTime() + 864e5); }
    else { from = new Date(start.getTime() + ((5 - d + 7) % 7) * 864e5); to = new Date(from.getTime() + 3 * 864e5); }
    return t >= from && t < to;
  }
  return t < new Date(start.getTime() + 7 * 864e5);
};
const hood = venue => {
  const v = (venue || "").toLowerCase();
  if (/wynwood|oasis/.test(v)) return "Wynwood";
  if (/south beach|sobes|miami beach|fillmore/.test(v)) return "Miami Beach";
  if (/downtown|kaseya|bayfront|frost/.test(v)) return "Downtown";
  if (/brickell/.test(v)) return "Brickell";
  if (/coconut grove|grove/.test(v)) return "Coconut Grove";
  if (/coral gables/.test(v)) return "Coral Gables";
  if (/doral/.test(v)) return "Doral";
  if (/hialeah/.test(v)) return "Hialeah";
  if (/hard rock|miami gardens/.test(v)) return "Miami Gardens";
  if (/little havana|calle ocho/.test(v)) return "Little Havana";
  if (/aventura/.test(v)) return "Aventura";
  if (/dadeland|kendall/.test(v)) return "Kendall";
  return "";
};

/* ---------- classification ---------- */
function classify(text) {
  const t = String(text || "").toLowerCase();
  const c = new Set();
  const has = re => re.test(t);
  if (has(/concert|music|band\b|dj\b|singer|rapper|orchestra|jazz|symphony|\btour\b|live music|festival|\bgig\b|songwriter/)) c.add("music");
  if (has(/\bvs\.?\b|\bgame\b|match|championship|tournament|fight|ufc|mma|boxing|marathon|\brace\b|derby|golf|tennis|soccer|basketball|baseball|football|hockey|\bheat\b|dolphins|marlins|inter miami|panthers|\bsports\b/)) c.add("sports");
  if (has(/theat(er|re)|musical|ballet|comedy|stand[\s-]?up|improv|\bart\b|gallery|museum|exhibit|\bfilm\b|movie|cirque|magic|circus|\bplay\b|opera|arts|literary|book/)) c.add("arts");
  if (has(/club|party|rooftop|late night|after hours|boat|nightlife|bar crawl|wine|beer|tasting|cocktail|\bfood\b|dining|brunch|lounge|happy hour/)) c.add("nightlife");
  if (!c.size) c.add("arts");
  return [...c];
}

/* ---------- fetch: SeatGeek ---------- */
async function fetchSeatGeek() {
  const out = [];
  try {
    const url = `https://api.seatgeek.com/2/events?client_id=${SG_ID}&lat=${LAT}&lon=${LON}&range=50mi&per_page=100&sort=score.desc`;
    const r = await fetch(url);
    if (!r.ok) throw new Error("sg " + r.status);
    const j = await r.json();
    for (const e of j.events || []) {
      const v = e.venue || {};
      const perf = (e.performers || [])[0] || {};
      const taxText = (e.taxonomies || []).map(t => t.name).join(" ") + " " + (e.type || "");
      out.push({
        id: "sg-" + e.id,
        name: e.title || e.short_title,
        venue: v.name || "",
        hood: hood(v.name + " " + (v.address || "") + " " + (v.city || "")),
        start: e.datetime_utc,
        img: perf.image || e.image || "",
        priceMin: e.stats?.lowest_price ?? null,
        priceMax: e.stats?.highest_price ?? null,
        url: e.url,
        src: "SeatGeek",
        pop: Math.min(1, e.score || 0),
        cats: classify((e.title || "") + " " + taxText),
        free: (e.stats?.lowest_price ?? 999) === 0
      });
    }
    return { ok: true, events: out };
  } catch (err) { console.warn("SeatGeek failed", err); return { ok: false, events: [] }; }
}

/* ---------- fetch: Ticketmaster ---------- */
function tmPop(e) {
  let p = 0.25;
  const dt = e.dates?.start?.dateTime ? new Date(e.dates.start.dateTime) : null;
  if (dt && !isNaN(dt)) {
    const days = (dt - Date.now()) / 864e5;
    if (days >= 0) p += 0.30 * Math.max(0, 1 - days / 21);
  }
  p += Math.min(0.15, (e.priceRanges?.length || 0) * 0.05);
  p += Math.min(0.15, (e.images || []).length * 0.015);
  if (e.dates?.status?.code === "onsale") p += 0.10;
  if ((e._embedded?.attractions || []).length) p += 0.05;
  return Math.min(0.95, p);
}
async function fetchTM() {
  const out = [];
  try {
    const url = `https://app.ticketmaster.com/discovery/v2/events.json?apikey=${TM_KEY}&latlong=${LAT},${LON}&radius=50&unit=miles&size=100&sort=date,asc`;
    const r = await fetch(url);
    if (!r.ok) throw new Error("tm " + r.status);
    const j = await r.json();
    for (const e of (j._embedded?.events) || []) {
      const v = e._embedded?.venues?.[0] || {};
      const pr = e.priceRanges?.[0];
      const img = (e.images || []).sort((a, b) => (b.width || 0) - (a.width || 0))[0];
      const clsText = (e.classifications || [])
        .map(c => [c.segment?.name, c.genre?.name, c.subGenre?.name].join(" ")).join(" ");
      out.push({
        id: "tm-" + e.id,
        name: e.name,
        venue: v.name || "",
        hood: hood(v.name + " " + (v.address?.line1 || "") + " " + (v.city?.name || "")),
        start: e.dates?.start?.dateTime,
        img: img?.url || "",
        priceMin: pr?.min ?? null,
        priceMax: pr?.max ?? null,
        url: e.url,
        src: "Ticketmaster",
        pop: tmPop(e),
        cats: classify((e.name || "") + " " + clsText),
        free: false
      });
    }
    return { ok: true, events: out };
  } catch (err) { console.warn("Ticketmaster failed", err); return { ok: false, events: [] }; }
}

/* ---------- dedupe ---------- */
function dedupe(lists) {
  const seen = new Map();
  for (const e of lists.flat()) {
    if (!e.start) continue;
    const key = (e.name || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 24)
      + "|" + new Date(e.start).toISOString().slice(0, 10);
    const cur = seen.get(key);
    if (!cur || (e.pop > cur.pop)) seen.set(key, e);
  }
  return [...seen.values()];
}

/* ---------- render pieces ---------- */
function priceHTML(e) {
  if (e.free || e.priceMin === 0) return `<div class="price"><span class="free">Free</span></div>`;
  if (e.priceMin == null) return `<div class="price"><small>See prices</small></div><div class="src">via ${esc(e.src)}</div>`;
  const p = "$" + Math.round(e.priceMin);
  const range = e.priceMax && e.priceMax > e.priceMin ? `<small> – $${Math.round(e.priceMax)}</small>` : "";
  return `<div class="price">${p}${range}</div><div class="src">via ${esc(e.src)}</div>`;
}
function artFor(e) {
  const cat0 = (e.cats && e.cats[0]) || "arts";
  const [bg, fg] = ART[cat0] || ART.arts;
  return `<div class="art" style="background:${bg};color:${fg}">
    <div class="art-ic">${ic(CAT_ICON[cat0] || "palette", 46)}</div>
    <div class="art-venue">${esc(e.venue || e.hood || "Miami")}</div>
  </div>`;
}
function imgBlock(e) {
  return `${artFor(e)}${e.img ? `<img src="${esc(e.img)}" loading="lazy" alt="" onerror="this.remove()">` : ""}`;
}
function metaHTML(e) {
  return `<div class="meta">
    <span>${ic("pin", 14)} ${esc(e.venue)}${e.hood ? " · " + esc(e.hood) : ""}</span>
    <span>${ic("calendar", 14)} ${fmtDate(e.start)} · ${fmtTime(e.start)}</span>
  </div>`;
}
function hotFlag(e) {
  return e.pop > 0.75 ? `<div class="hotflag">${ic("flame", 12)} Hot</div>` : "";
}
function cardHTML(e, i) {
  return `
  <article class="card" data-id="${esc(e.id)}" style="animation-delay:${Math.min(i * 40, 320)}ms">
    <div class="img">${imgBlock(e)}</div>
    <div class="body">
      ${hotFlag(e)}
      <h3>${esc(e.name)}</h3>
      ${metaHTML(e)}
      <div class="foot">
        ${priceHTML(e)}
        <button class="getbtn" data-tix="${esc(e.id)}">GET</button>
      </div>
    </div>
  </article>`;
}
function heroHTML(e) {
  return `
  <div class="hero-label">${ic("spark", 12)} Don't miss</div>
  <article class="hero-card" data-id="${esc(e.id)}">
    <div class="img">${imgBlock(e)}
      <div class="overlay">
        <div class="eyebrow">${esc(e.hood || e.venue || "Miami")}</div>
        <h3>${esc(e.name)}</h3>
        <div class="sub">${fmtDate(e.start)} · ${fmtTime(e.start)}</div>
      </div>
    </div>
    <div class="foot">
      ${priceHTML(e)}
      <button class="getbtn" data-tix="${esc(e.id)}">GET</button>
    </div>
  </article>`;
}
function emptyHTML(icon, title, sub) {
  return `<div class="state"><div class="state-ic">${ic(icon, 44)}</div><h2>${title}</h2><p>${sub}</p></div>`;
}
function errorHTML() {
  return `<div class="state"><div class="state-ic">${ic("alert", 44)}</div>
    <h2>Couldn't Load Events</h2><p>Check your connection and try again.</p>
    <button class="bluebtn" id="retryBtn">${ic("refresh", 16)} Try Again</button></div>`;
}
function skeletons() {
  return Array.from({ length: 4 }, () =>
    `<div class="skel"><div class="im"></div><div class="ln"></div><div class="ln"></div></div>`).join("");
}

function filtered() {
  let list = EVENTS.filter(e => inRange(e.start, range));
  if (cat !== "all") list = list.filter(e => cat === "free" ? (e.free || e.priceMin === 0) : e.cats.includes(cat));
  if (query) {
    const q = query.toLowerCase();
    list = list.filter(e => (e.name + " " + e.venue).toLowerCase().includes(q));
  }
  const by = {
    pop: (a, b) => b.pop - a.pop,
    date: (a, b) => new Date(a.start) - new Date(b.start),
    price: (a, b) => (a.priceMin ?? 1e9) - (b.priceMin ?? 1e9)
  }[sortBy];
  return list.sort(by);
}
function render() {
  const feed = $("#feed");
  const n = EVENTS.filter(e => inRange(e.start, "tonight")).length;
  $("#liveCount").textContent = n ? n + " tonight" : "nothing tonight";
  if (view === "saved") { renderSaved(); return; }
  if (!loadedOnce) { feed.innerHTML = skeletons(); $("#count").textContent = ""; return; }
  if (loadError) { feed.innerHTML = errorHTML(); $("#count").textContent = ""; return; }
  const list = filtered();
  if (!list.length) {
    $("#count").textContent = "";
    feed.innerHTML = emptyHTML("moon", "No Events",
      range === "tonight" ? "Nothing on tonight — try This Week." : "Try a different date range or category.");
    return;
  }
  $("#count").textContent = `${list.length} event${list.length > 1 ? "s" : ""}`;
  const hero = list.reduce((a, b) => (b.pop > (a?.pop ?? -1) ? b : a), null);
  const rest = hero ? list.filter(x => x !== hero) : list;
  feed.innerHTML = (hero ? heroHTML(hero) : "") + rest.map(cardHTML).join("");
}
function renderSaved() {
  const feed = $("#feed");
  const list = EVENTS.filter(e => saved.has(e.id)).sort((a, b) => new Date(a.start) - new Date(b.start));
  $("#count").textContent = list.length ? `${list.length} saved` : "";
  feed.innerHTML = list.length
    ? list.map(cardHTML).join("")
    : emptyHTML("bookmark", "No Saved Events", "Tap an event, then Save, to keep it here.");
}

/* ---------- detail sheet ---------- */
function openSheet(e) {
  const sh = $("#sheet");
  const isSaved = saved.has(e.id);
  const priceLine = e.free || e.priceMin === 0 ? "Free"
    : e.priceMin != null ? "From $" + Math.round(e.priceMin) : "See ticket page";
  sh.innerHTML = `
    <div class="grab"></div>
    <div class="hero">${imgBlock(e)}
      <button class="closebtn" id="sheetClose" aria-label="Close">${ic("x", 15)}</button>
    </div>
    <div class="content">
      <h2>${esc(e.name)}</h2>
      <div class="group">
        <div class="grow"><div class="gic" style="background:#007AFF">${ic("calendar", 16)}</div><div><b>${fmtDate(e.start)}</b><span>${fmtTime(e.start)}</span></div></div>
        <div class="grow"><div class="gic" style="background:#FF3B30">${ic("pin", 16)}</div><div><b>${esc(e.venue)}</b><span>${esc(e.hood || "Miami")}</span></div></div>
        <div class="grow"><div class="gic" style="background:#34C759">${ic("ticket", 16)}</div><div><b>${priceLine}</b><span>via ${esc(e.src)}</span></div></div>
      </div>
      <button class="bigtix" id="sheetTix">Get Tickets ${ic("chevR", 16)}</button>
      <div class="btnrow">
        <button class="sysbtn${isSaved ? " saved" : ""}" id="sheetSave">${ic("bookmark", 16)} ${isSaved ? "Saved" : "Save"}</button>
        <button class="sysbtn" id="sheetShare">${ic("share", 16)} Share</button>
      </div>
      <div class="src-note">Tickets via ${esc(e.src)} — prices may vary</div>
    </div>`;
  $("#scrim").classList.add("on");
  sh.classList.add("on");
  sh.scrollTop = 0;
  $("#sheetClose").onclick = ev => { ev.stopPropagation(); closeSheet(); };
  $("#sheetTix").onclick = ev => { ev.stopPropagation(); window.open(e.url, "_blank", "noopener"); };
  $("#sheetSave").onclick = ev => {
    ev.stopPropagation();
    saved.has(e.id) ? saved.delete(e.id) : saved.add(e.id);
    localStorage.setItem("mia-saved", JSON.stringify([...saved]));
    openSheet(e); render();
  };
  $("#sheetShare").onclick = async ev => {
    ev.stopPropagation();
    const text = `${e.name} — ${fmtDate(e.start)} at ${e.venue}: ${e.url}`;
    if (navigator.share) { try { await navigator.share({ title: e.name, text }); } catch {} }
    else { try { await navigator.clipboard.writeText(text); $("#sheetShare").innerHTML = `${ic("share", 16)} Copied`; } catch {} }
  };
}
function closeSheet() { $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); }

/* ---------- chrome wiring ---------- */
function moveThumb() {
  const btns = [...document.querySelectorAll("#seg button")];
  const on = btns.find(b => b.dataset.r === range) || btns[0];
  const th = $("#segThumb");
  th.style.left = on.offsetLeft + "px";
  th.style.width = on.offsetWidth + "px";
}
function syncSeg() {
  document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x.dataset.r === range));
  moveThumb();
}
function renderPills() {
  $("#pills").innerHTML = CATS.map(([k, l, icn]) =>
    `<button class="chip${k === cat ? " on" : ""}" data-c="${k}">${ic(icn, 15)} ${l}</button>`).join("");
}
function renderSort() {
  $("#sort").innerHTML = SORTS.map(([k, l, icn]) =>
    `<button data-s="${k}" class="${k === sortBy ? "on" : ""}">${ic(icn, 13)} ${l}</button>`).join("");
}
function setView(v) {
  view = v;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.t === v));
  document.body.classList.toggle("saved-view", v === "saved");
  render();
  window.scrollTo({ top: 0 });
}

document.addEventListener("DOMContentLoaded", () => {
  $("#dateline").textContent = new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  $("#searchIc").innerHTML = ic("search", 18);
  $("#refreshBtn").innerHTML = ic("refresh", 19);
  $("#tabEvents").insertAdjacentHTML("afterbegin", ic("ticket", 24));
  $("#tabSaved").insertAdjacentHTML("afterbegin", ic("bookmark", 24));

  renderPills(); renderSort(); syncSeg();
  window.addEventListener("resize", moveThumb);
  setTimeout(moveThumb, 60);

  $("#seg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    range = b.dataset.r; syncSeg(); render();
  });
  $("#pills").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    cat = b.dataset.c; renderPills(); render();
  });
  $("#sort").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    sortBy = b.dataset.s; renderSort(); render();
  });
  let qT;
  $("#q").addEventListener("input", e => {
    clearTimeout(qT);
    qT = setTimeout(() => { query = e.target.value.trim(); render(); }, 220);
  });
  document.querySelectorAll(".tab").forEach(t =>
    t.addEventListener("click", () => setView(t.dataset.t)));

  $("#feed").addEventListener("click", e => {
    if (e.target.closest("#retryBtn")) { load(true); return; }
    const tix = e.target.closest("[data-tix]");
    if (tix) {
      e.stopPropagation();
      const ev = EVENTS.find(x => x.id === tix.dataset.tix);
      if (ev) window.open(ev.url, "_blank", "noopener");
      return;
    }
    const card = e.target.closest(".card, .hero-card");
    if (card) {
      const ev = EVENTS.find(x => x.id === card.dataset.id);
      if (ev) openSheet(ev);
    }
  });
  $("#scrim").addEventListener("click", closeSheet);

  /* sheet swipe-down to close */
  const sh = $("#sheet");
  let sY = null;
  sh.addEventListener("touchstart", e => {
    if (sh.scrollTop <= 0) sY = e.touches[0].clientY;
  }, { passive: true });
  sh.addEventListener("touchmove", e => {
    if (sY === null) return;
    const dy = e.touches[0].clientY - sY;
    if (dy > 0) sh.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  sh.addEventListener("touchend", e => {
    if (sY === null) return;
    const dy = (e.changedTouches[0] || {}).clientY - sY;
    sY = null; sh.style.transform = "";
    if (dy > 110) closeSheet();
  });

  /* visible refresh button */
  $("#refreshBtn").addEventListener("click", () => doRefresh());

  /* native-style pull-to-refresh */
  const ptr = $("#ptr"), ptrSpin = $("#ptrSpin");
  let pStartY = null;
  document.addEventListener("touchstart", e => {
    if (window.scrollY <= 0 && view === "events") pStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (pStartY === null) return;
    const dy = e.touches[0].clientY - pStartY;
    if (dy > 0) ptr.style.height = Math.min(dy * 0.5, 76) + "px";
  }, { passive: true });
  document.addEventListener("touchend", () => {
    if (pStartY === null) return;
    const h = parseFloat(ptr.style.height) || 0;
    pStartY = null;
    if (h >= 56) doRefresh();
    else ptr.style.height = "0px";
  });

  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  load();
});

async function doRefresh() {
  const ptr = $("#ptr"), spin = $("#ptrSpin"), rbtn = $("#refreshBtn");
  spin.classList.add("spinning");
  rbtn.classList.add("spinning");
  ptr.style.height = "52px";
  await load(true);
  spin.classList.remove("spinning");
  rbtn.classList.remove("spinning");
  ptr.style.height = "0px";
}

/* ---------- load ---------- */
async function load(force) {
  if (!force && loadedOnce) { render(); return; }
  loadError = false;
  if (!loadedOnce) render(); // skeletons
  const [sg, tm] = await Promise.all([fetchSeatGeek(), fetchTM()]);
  const all = dedupe([sg.events, tm.events]).filter(e => e.start && !isNaN(new Date(e.start)));
  if ((!sg.ok && !tm.ok) || !all.length) loadError = true;
  EVENTS = all;
  loadedOnce = true;
  render();
}
</script>
