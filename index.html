<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08080c">
<title>MIAMI — What's On</title>
<style>
:root {
  --bg: #08080c;
  --glass: rgba(255,255,255,0.07);
  --glass-strong: rgba(255,255,255,0.12);
  --glass-border: rgba(255,255,255,0.14);
  --ink: #f5f5f7;
  --muted: rgba(245,245,247,0.55);
  --faint: rgba(245,245,247,0.35);
  --accent: #7d7aff;
  --accent2: #00d4ff;
  --pink: #ff5e8a;
  --green: #34e0a1;
  --amber: #ffb340;
  --spring: cubic-bezier(0.32, 0.72, 0, 1);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Inter, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100dvh;
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
/* ambient gradient mesh */
.mesh {
  position: fixed; inset: 0; z-index: -1; overflow: hidden;
  background: radial-gradient(120% 90% at 15% 0%, rgba(125,122,255,0.16), transparent 55%),
              radial-gradient(120% 100% at 90% 10%, rgba(0,212,255,0.10), transparent 50%),
              radial-gradient(140% 110% at 50% 110%, rgba(255,94,138,0.10), transparent 55%),
              var(--bg);
}
.mesh::after {
  content: ""; position: absolute; inset: -40%;
  background: conic-gradient(from 0deg at 50% 50%, transparent, rgba(125,122,255,0.05), transparent 30%);
  animation: drift 24s linear infinite;
}
@keyframes drift { to { transform: rotate(360deg); } }

.app { max-width: 560px; margin: 0 auto; padding: calc(var(--sat) + 16px) 16px calc(var(--sab) + 104px); }

/* header */
header.top { display: flex; align-items: flex-end; justify-content: space-between; padding: 8px 4px 16px; }
.brand h1 {
  font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1;
  background: linear-gradient(135deg, #fff 20%, var(--accent2) 70%, var(--accent) 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.brand p { font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 500; }
.hright { display: flex; align-items: center; gap: 8px; }
.live-dot {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--green);
  background: var(--glass); border: 1px solid var(--glass-border);
  padding: 8px 12px; border-radius: 999px;
  -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
}
.live-dot i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.4; transform: scale(0.8); } }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: var(--glass); border: 1px solid var(--glass-border); color: var(--muted);
  cursor: pointer; transition: transform 0.25s var(--spring), color 0.2s;
  -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
}
.icon-btn:active { transform: scale(0.88) rotate(-40deg); color: #fff; }
.icon-btn svg.spinning { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* pull to refresh */
.ptr { height: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; transition: height 0.25s var(--spring); }
.ptr .ptr-spin { color: var(--muted); display: grid; place-items: center; }
.ptr .ptr-spin.spinning { animation: spin 0.9s linear infinite; color: #fff; }

/* search */
.search {
  display: flex; align-items: center; gap: 10px;
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px;
  padding: 12px 16px; margin-bottom: 16px;
  -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8);
  box-shadow: 0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
}
.search svg { flex: none; opacity: 0.5; }
.search input {
  flex: 1; background: none; border: 0; outline: 0; color: var(--ink);
  font-size: 16px; font-weight: 500; font-family: inherit;
}
.search input::placeholder { color: var(--faint); }

/* segmented control */
.seg {
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
  border-radius: 16px; padding: 4px; margin-bottom: 16px; position: relative;
  -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
}
.seg button {
  border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 700;
  padding: 10px 0; border-radius: 12px; cursor: pointer; position: relative; z-index: 1;
  transition: color 0.25s var(--spring); font-family: inherit;
}
.seg button.on { color: #fff; }
.seg .thumb {
  position: absolute; top: 4px; bottom: 4px; border-radius: 12px; z-index: 0;
  background: linear-gradient(135deg, rgba(125,122,255,0.55), rgba(0,212,255,0.35));
  border: 1px solid rgba(255,255,255,0.22);
  box-shadow: 0 4px 20px rgba(125,122,255,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
  transition: left 0.35s var(--spring), width 0.35s var(--spring);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}

/* category pills */
.pills { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 16px; scrollbar-width: none; }
.pills::-webkit-scrollbar { display: none; }
.pill {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--glass-border); background: var(--glass);
  color: var(--muted); font-size: 13.5px; font-weight: 600; padding: 8px 16px; border-radius: 999px;
  cursor: pointer; transition: all 0.25s var(--spring); font-family: inherit; white-space: nowrap;
  -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
}
.pill svg { opacity: 0.8; }
.pill:active { transform: scale(0.94); }
.pill.on {
  background: linear-gradient(135deg, rgba(125,122,255,0.4), rgba(0,212,255,0.25));
  color: #fff; border-color: rgba(125,122,255,0.5);
  box-shadow: 0 4px 18px rgba(125,122,255,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
}

/* toolbar row */
.toolbar { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 16px; }
.count { font-size: 13px; color: var(--faint); font-weight: 600; }
.sort { display: flex; gap: 8px; }
.sort button {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid transparent; background: none; color: var(--faint);
  font-size: 12.5px; font-weight: 700; padding: 8px 12px; border-radius: 10px; cursor: pointer;
  font-family: inherit; transition: all 0.2s var(--spring);
}
.sort button.on { color: var(--ink); background: var(--glass); border-color: var(--glass-border); }

/* hero label */
.hero-label {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent2); padding: 0 4px 8px;
}

/* event cards */
.feed { display: grid; gap: 16px; }
.card {
  position: relative; border-radius: 24px; overflow: hidden; cursor: pointer;
  background: var(--glass); border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(28px) saturate(1.8); backdrop-filter: blur(28px) saturate(1.8);
  box-shadow: 0 12px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
  transition: transform 0.3s var(--spring), box-shadow 0.3s var(--spring);
  animation: rise 0.4s var(--spring) backwards;
}
@keyframes rise { from { opacity: 0; transform: translateY(16px) scale(0.98); } }
.card:active { transform: scale(0.97); }
.card .img { position: relative; height: 180px; overflow: hidden; }
.card .img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.card .img::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(8,8,12,0.85), transparent 55%);
}
/* category artwork fallback (always rendered under the photo) */
.art {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding: 16px; text-align: center;
}
.art .art-ic { color: rgba(255,255,255,0.85); display: grid; place-items: center;
  width: 88px; height: 88px; border-radius: 50%;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.art .art-venue {
  font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(255,255,255,0.65); max-width: 90%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card .badges { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; z-index: 2; }
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 6px 10px; border-radius: 999px; color: #fff;
  background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.2);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.badge.hot { background: linear-gradient(135deg, rgba(255,94,138,0.85), rgba(255,94,138,0.5)); border-color: rgba(255,94,138,0.6); }
.badge.free { background: linear-gradient(135deg, rgba(52,224,161,0.85), rgba(52,224,161,0.4)); border-color: rgba(52,224,161,0.6); }
.badge.src { margin-left: auto; opacity: 0.85; text-transform: none; letter-spacing: 0; font-weight: 600; }
.card .body { padding: 16px 16px 16px; position: relative; }
.card h3 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; margin-bottom: 8px; }
.hero-card h3 { font-size: 21px; }
.card .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); font-weight: 500; }
.card .meta span { display: inline-flex; align-items: center; gap: 6px; }
.card .meta svg { flex: none; opacity: 0.7; }
.card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
.price { font-size: 15px; font-weight: 800; }
.price small { font-weight: 600; color: var(--faint); font-size: 11.5px; }
.tix {
  display: inline-flex; align-items: center; gap: 6px;
  border: 0; cursor: pointer; font-family: inherit;
  font-size: 14px; font-weight: 800; color: #fff; padding: 12px 20px; border-radius: 999px;
  background: linear-gradient(135deg, var(--accent), #5b5bf0 60%, var(--accent2));
  box-shadow: 0 6px 24px rgba(125,122,255,0.45), inset 0 1px 0 rgba(255,255,255,0.3);
  transition: transform 0.2s var(--spring), box-shadow 0.2s;
}
.tix:active { transform: scale(0.93); }

/* skeleton */
.skel { border-radius: 24px; overflow: hidden; background: var(--glass); border: 1px solid var(--glass-border); }
.skel .im { height: 180px; background: linear-gradient(100deg, rgba(255,255,255,0.04) 40%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.04) 60%); background-size: 200% 100%; animation: sh 1.4s infinite; }
.skel .ln { height: 14px; border-radius: 7px; margin: 16px 16px 0; background: rgba(255,255,255,0.07); }
.skel .ln:last-child { margin-bottom: 16px; width: 55%; }
@keyframes sh { to { background-position: -200% 0; } }

/* empty + error */
.state { text-align: center; padding: 64px 32px; color: var(--muted); }
.state-ic {
  width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 16px;
  display: grid; place-items: center; color: var(--faint);
  background: var(--glass); border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}
.state h2 { font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
.state p { font-size: 14px; line-height: 1.5; }
.state .tix { margin-top: 16px; }

/* bottom nav */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  padding: 8px 20px calc(var(--sab) + 16px);
  background: rgba(12,12,18,0.6);
  -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
  border-top: 1px solid rgba(255,255,255,0.08);
}
.tabbar .row { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.tab {
  border: 0; background: none; color: var(--faint); font-family: inherit; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; padding: 8px 0 4px;
  transition: color 0.2s, transform 0.2s var(--spring);
}
.tab:active { transform: scale(0.9); }
.tab.on { color: #fff; }
.tab svg { width: 23px; height: 23px; }

/* saved view: hide browsing controls */
.saved-view #searchWrap, .saved-view #seg, .saved-view #pills, .saved-view .toolbar, .saved-view .hero-label { display: none; }

/* detail sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.3s; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 95; max-width: 560px; margin: 0 auto;
  max-height: 88dvh; overflow-y: auto; border-radius: 28px 28px 0 0;
  background: rgba(20,20,28,0.82); border: 1px solid var(--glass-border); border-bottom: 0;
  -webkit-backdrop-filter: blur(40px) saturate(2); backdrop-filter: blur(40px) saturate(2);
  transform: translateY(105%); transition: transform 0.4s var(--spring);
  box-shadow: 0 -20px 80px rgba(0,0,0,0.6);
  padding-bottom: calc(var(--sab) + 24px);
}
.sheet.on { transform: translateY(0); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.25); margin: 8px auto 0; }
.sheet .hero { position: relative; margin: 16px 16px 0; border-radius: 20px; overflow: hidden; }
.sheet .hero .img { height: 220px; }
.sheet .content { padding: 16px 24px 0; }
.sheet h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 8px; }
.sheet .rows { display: grid; gap: 8px; margin: 16px 0 16px; }
.sheet .row { display: flex; gap: 12px; align-items: center; font-size: 14.5px; }
.sheet .row .ic { flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--glass-border); color: var(--muted); }
.sheet .row b { display: block; font-weight: 700; }
.sheet .row span { color: var(--muted); font-size: 13px; }
.sheet .tix { width: 100%; padding: 16px; font-size: 16px; border-radius: 16px; justify-content: center; }
.sheet .ghost {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  flex: 1; padding: 14px; font-size: 14px; font-weight: 700; font-family: inherit; color: var(--ink);
  background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); border-radius: 16px;
  cursor: pointer; transition: transform 0.2s var(--spring);
}
.sheet .ghost:active { transform: scale(0.95); }
.sheet .btnrow { display: flex; gap: 8px; margin-top: 8px; }
.sheet .src-note { text-align: center; font-size: 12px; color: var(--faint); margin-top: 16px; }
</style>
</head>
<body>
<div class="mesh"></div>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>MIAMI</h1>
      <p id="dateline">What's on</p>
    </div>
    <div class="hright">
      <div class="live-dot"><i></i><span id="liveCount">···</span></div>
      <button class="icon-btn" id="refreshBtn" aria-label="Refresh events"></button>
    </div>
  </header>

  <div class="ptr" id="ptr"><div class="ptr-spin" id="ptrSpin"></div></div>

  <div class="search" id="searchWrap">
    <span id="searchIc"></span>
    <input id="q" type="search" placeholder="Search events, venues, artists…" autocomplete="off">
  </div>

  <div class="seg" id="seg">
    <div class="thumb" id="segThumb"></div>
    <button data-r="tonight">Tonight</button>
    <button data-r="week">This Week</button>
    <button data-r="weekend">Weekend</button>
  </div>

  <div class="pills" id="pills"></div>

  <div class="toolbar">
    <div class="count" id="count"></div>
    <div class="sort" id="sort"></div>
  </div>

  <div class="feed" id="feed"></div>
</div>

<nav class="tabbar"><div class="row">
  <button class="tab on" data-t="events" id="tabEvents">
    EVENTS
  </button>
  <button class="tab" data-t="saved" id="tabSaved">
    SAVED
  </button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>

<script>
"use strict";
/* ---------- config ---------- */
const SG_ID = "MzA2MzY2NDN8MTc5MTI5NDQwOC42NDM0NDIy";

const ICONS = {

  calendar: '<rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',

  spark: '<path d="M12 2c.6 5.6 4.4 9.4 10 10-5.6.6-9.4 4.4-10 10-.6-5.6-4.4-9.4-10-10 5.6-.6 9.4-4.4 10-10z"/>'

const ic = (n, s = 18) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* category → artwork gradient + icon */
const ART = {
  music:     "radial-gradient(120% 130% at 20% 10%, #4c3dd1 0%, #1b1440 55%, #0a0a12 100%)",
  sports:    "radial-gradient(120% 130% at 20% 10%, #0e7a55 0%, #123a24 55%, #0a0a12 100%)",
  arts:      "radial-gradient(120% 130% at 20% 10%, #a11d52 0%, #3a1440 55%, #0a0a12 100%)",
  nightlife: "radial-gradient(120% 130% at 20% 10%, #1d2f8f 0%, #2a1040 55%, #0a0a12 100%)"
};
const CAT_ICON = { music: "music", sports: "trophy", arts: "palette", nightlife: "moon" };

/* ---------- state ---------- */
let EVENTS = [];
const smartRange = () => { const d = new Date().getDay(); return (d === 5 || d === 6) ? "tonight" : "week"; };
let range = smartRange(), cat = "all", sortBy = "pop", query = "", view = "events";
let saved = new Set(JSON.parse(localStorage.getItem("mia-saved") || "[]"));
let loadedOnce = false, loadError = false;
const CATS = [
  ["all", "All", "spark"], ["music", "Music", "music"], ["sports", "Sports", "trophy"],
  ["arts", "Arts", "palette"], ["nightlife", "Nightlife", "moon"], ["free", "Free", "tag"]
];
const SORTS = [["pop", "Hot", "flame"], ["date", "Date", "calendar"], ["price", "Price", "tag"]];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => new Date(iso).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
const fmtTime = iso => new Date(iso).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
const dayStart = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const inRange = (iso, r) => {
  const now = new Date(), t = new Date(iso), start = dayStart(now), d = now.getDay();
  if (isNaN(t) || t < start) return false;
  if (r === "tonight") return t < new Date(start.getTime() + 864e5);
  if (r === "weekend") {
    let from, to;
    if (d === 6) { from = start; to = new Date(start.getTime() + 2 * 864e5); }       // Sat → Sat+Sun
    else if (d === 0) { from = start; to = new Date(start.getTime() + 864e5); }      // Sun → today
    else { from = new Date(start.getTime() + ((5 - d + 7) % 7) * 864e5); to = new Date(from.getTime() + 3 * 864e5); } // upcoming Fri–Sun
    return t >= from && t < to;
  }
  return t < new Date(start.getTime() + 7 * 864e5); // week
};
const hood = venue => {
  const v = (venue || "").toLowerCase();
  if (/wynwood|oasis/.test(v)) return "Wynwood";
  if (/south beach|sobes|miami beach|fillmore/.test(v)) return "Miami Beach";
  if (/downtown|kaseya|bayfront|frost/.test(v)) return "Downtown";
  if (/brickell/.test(v)) return "Brickell";
  if (/coconut grove|grove/.test(v)) return "Coconut Grove";
  if (/coral gables/.test(v)) return "Coral Gables";
  if (/doral/.test(v)) return "Doral";
  if (/hialeah/.test(v)) return "Hialeah";
  if (/hard rock|miami gardens/.test(v)) return "Miami Gardens";
  if (/little havana|calle ocho/.test(v)) return "Little Havana";
  if (/aventura/.test(v)) return "Aventura";
  if (/dadeland|kendall/.test(v)) return "Kendall";
  return "";
};

/* ---------- classification (structured taxonomies + keywords, arts fallback) ---------- */
function classify(text) {
  const t = String(text || "").toLowerCase();
  const c = new Set();
  const has = re => re.test(t);
  if (has(/concert|music|band\b|dj\b|singer|rapper|orchestra|jazz|symphony|\btour\b|live music|festival|\bgig\b|songwriter/)) c.add("music");
  if (has(/\bvs\.?\b|\bgame\b|match|championship|tournament|fight|ufc|mma|boxing|marathon|\brace\b|derby|golf|tennis|soccer|basketball|baseball|football|hockey|\bheat\b|dolphins|marlins|inter miami|panthers|\bsports\b/)) c.add("sports");
  if (has(/theat(er|re)|musical|ballet|comedy|stand[\s-]?up|improv|\bart\b|gallery|museum|exhibit|\bfilm\b|movie|cirque|magic|circus|\bplay\b|opera|arts|literary|book/)) c.add("arts");
  if (has(/club|party|rooftop|late night|after hours|boat|nightlife|bar crawl|wine|beer|tasting|cocktail|\bfood\b|dining|brunch|lounge|happy hour/)) c.add("nightlife");
  if (!c.size) c.add("arts");
  return [...c];
}

/* ---------- fetch: SeatGeek ---------- */
async function fetchSeatGeek() {
  const out = [];
  try {
    const url = `https://api.seatgeek.com/2/events?client_id=${SG_ID}&lat=${LAT}&lon=${LON}&range=50mi&per_page=100&sort=score.desc`;
    const r = await fetch(url);
    if (!r.ok) throw new Error("sg " + r.status);
    const j = await r.json();
    for (const e of j.events || []) {
      const v = e.venue || {};
      const perf = (e.performers || [])[0] || {};
      const taxText = (e.taxonomies || []).map(t => t.name).join(" ") + " " + (e.type || "");
      out.push({
        id: "sg-" + e.id,
        name: e.title || e.short_title,
        venue: v.name || "",
        hood: hood(v.name + " " + (v.address || "") + " " + (v.city || "")),
        start: e.datetime_utc,
        img: perf.image || e.image || "",
        priceMin: e.stats?.lowest_price ?? null,
        priceMax: e.stats?.highest_price ?? null,
        url: e.url,
        src: "SeatGeek",
        pop: Math.min(1, e.score || 0),
        cats: classify((e.title || "") + " " + taxText),
        free: (e.stats?.lowest_price ?? 999) === 0
      });
    }
    return { ok: true, events: out };
  } catch (err) { console.warn("SeatGeek failed", err); return { ok: false, events: [] }; }
}

/* ---------- fetch: Ticketmaster (normalized 0–1 popularity) ---------- */
function tmPop(e) {
  let p = 0.25;
  const dt = e.dates?.start?.dateTime ? new Date(e.dates.start.dateTime) : null;
  if (dt && !isNaN(dt)) {
    const days = (dt - Date.now()) / 864e5;
    if (days >= 0) p += 0.30 * Math.max(0, 1 - days / 21);   // sooner = hotter
  }
  p += Math.min(0.15, (e.priceRanges?.length || 0) * 0.05);  // demand depth
  p += Math.min(0.15, (e.images || []).length * 0.015);      // promotion depth
  if (e.dates?.status?.code === "onsale") p += 0.10;
  if ((e._embedded?.attractions || []).length) p += 0.05;
  return Math.min(0.95, p);
}
async function fetchTM() {
  const out = [];
  try {
    const url = `https://app.ticketmaster.com/discovery/v2/events.json?apikey=${TM_KEY}&latlong=${LAT},${LON}&radius=50&unit=miles&size=100&sort=date,asc`;
    const r = await fetch(url);
    if (!r.ok) throw new Error("tm " + r.status);
    const j = await r.json();
    for (const e of (j._embedded?.events) || []) {
      const v = e._embedded?.venues?.[0] || {};
      const pr = e.priceRanges?.[0];
      const img = (e.images || []).sort((a, b) => (b.width || 0) - (a.width || 0))[0];
      const clsText = (e.classifications || [])
        .map(c => [c.segment?.name, c.genre?.name, c.subGenre?.name].join(" ")).join(" ");
      out.push({
        id: "tm-" + e.id,
        name: e.name,
        venue: v.name || "",
        hood: hood(v.name + " " + (v.address?.line1 || "") + " " + (v.city?.name || "")),
        start: e.dates?.start?.dateTime,
        img: img?.url || "",
        priceMin: pr?.min ?? null,
        priceMax: pr?.max ?? null,
        url: e.url,
        src: "Ticketmaster",
        pop: tmPop(e),
        cats: classify((e.name || "") + " " + clsText),
        free: false
      });
    }
    return { ok: true, events: out };
  } catch (err) { console.warn("Ticketmaster failed", err); return { ok: false, events: [] }; }
}

/* ---------- dedupe ---------- */
function dedupe(lists) {
  const seen = new Map();
  for (const e of lists.flat()) {
    if (!e.start) continue;
    const key = (e.name || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 24)
      + "|" + new Date(e.start).toISOString().slice(0, 10);
    const cur = seen.get(key);
    if (!cur || (e.pop > cur.pop)) seen.set(key, e);
  }
  return [...seen.values()];
}

/* ---------- render pieces ---------- */
function priceStr(e) {
  if (e.free || e.priceMin === 0) return `<span style="color:var(--green)">FREE</span>`;
  if (e.priceMin == null) return `<small>See prices</small>`;
  const p = "$" + Math.round(e.priceMin);
  return e.priceMax && e.priceMax > e.priceMin ? `${p}<small> – $${Math.round(e.priceMax)}</small>` : p;
}
function artFor(e) {
  const cat0 = (e.cats && e.cats[0]) || "arts";
  return `<div class="art" style="background:${ART[cat0] || ART.arts}">
    <div class="art-ic">${ic(CAT_ICON[cat0] || "palette", 44)}</div>
    <div class="art-venue">${esc(e.venue || e.hood || "Miami")}</div>
  </div>`;
}
function imgBlock(e, h) {
  return `<div class="img" style="height:${h}px">
    ${artFor(e)}
    ${e.img ? `<img src="${esc(e.img)}" loading="lazy" alt="" onerror="this.remove()">` : ""}
    <div class="badges">${badges(e)}</div>
  </div>`;
}
function badges(e) {
  let b = "";
  if (e.pop > 0.75) b += `<span class="badge hot">${ic("flame", 11)} Hot</span>`;
  if (e.free || e.priceMin === 0) b += `<span class="badge free">${ic("tag", 11)} Free</span>`;
  if (saved.has(e.id)) b += `<span class="badge">${ic("bookmark", 11)} Saved</span>`;
  b += `<span class="badge src">${esc(e.src)}</span>`;
  return b;
}
function metaHTML(e) {
  return `<div class="meta">
    <span>${ic("pin", 14)} ${esc(e.venue)}${e.hood ? " · " + esc(e.hood) : ""}</span>
    <span>${ic("calendar", 14)} ${fmtDate(e.start)} · ${fmtTime(e.start)}</span>
  </div>`;
}
function cardHTML(e, i) {
  return `
  <article class="card" data-id="${esc(e.id)}" style="animation-delay:${Math.min(i * 40, 320)}ms">
    ${imgBlock(e, 180)}
    <div class="body">
      <h3>${esc(e.name)}</h3>
      ${metaHTML(e)}
      <div class="foot">
        <div class="price">${priceStr(e)}</div>
        <button class="tix" data-tix="${esc(e.id)}">Get Tickets ${ic("chevR", 15)}</button>
      </div>
    </div>
  </article>`;
}
function heroHTML(e) {
  return `
  <div class="hero-label">${ic("spark", 12)} Don't miss</div>
  <article class="card hero-card" data-id="${esc(e.id)}">
    ${imgBlock(e, 220)}
    <div class="body">
      <h3>${esc(e.name)}</h3>
      ${metaHTML(e)}
      <div class="foot">
        <div class="price">${priceStr(e)}</div>
        <button class="tix" data-tix="${esc(e.id)}">Get Tickets ${ic("chevR", 15)}</button>
      </div>
    </div>
  </article>`;
}
function emptyHTML(icon, title, sub) {
  return `<div class="state"><div class="state-ic">${ic(icon, 40)}</div><h2>${title}</h2><p>${sub}</p></div>`;
}
function errorHTML() {
  return `<div class="state"><div class="state-ic">${ic("alert", 40)}</div>
    <h2>Couldn't load events</h2><p>Check your connection and try again.</p>
    <button class="tix" id="retryBtn">${ic("refresh", 15)} Retry</button></div>`;
}
function skeletons() {
  return Array.from({ length: 4 }, () =>
    `<div class="skel"><div class="im"></div><div class="ln"></div><div class="ln"></div></div>`).join("");
}

function filtered() {
  let list = EVENTS.filter(e => inRange(e.start, range));
  if (cat !== "all") list = list.filter(e => cat === "free" ? (e.free || e.priceMin === 0) : e.cats.includes(cat));
  if (query) {
    const q = query.toLowerCase();
    list = list.filter(e => (e.name + " " + e.venue).toLowerCase().includes(q));
  }
  const by = {
    pop: (a, b) => b.pop - a.pop,
    date: (a, b) => new Date(a.start) - new Date(b.start),
    price: (a, b) => (a.priceMin ?? 1e9) - (b.priceMin ?? 1e9)
  }[sortBy];
  return list.sort(by);
}
function updateLive() {
  const n = EVENTS.filter(e => inRange(e.start, "tonight")).length;
  $("#liveCount").textContent = n + " tonight";
}
function render() {
  const feed = $("#feed");
  updateLive();
  if (view === "saved") { renderSaved(); return; }
  if (!loadedOnce) { feed.innerHTML = skeletons(); $("#count").textContent = ""; return; }
  if (loadError) { feed.innerHTML = errorHTML(); $("#count").textContent = ""; return; }
  const list = filtered();
  if (!list.length) {
    $("#count").textContent = "";
    feed.innerHTML = emptyHTML("moon", "Nothing here",
      range === "tonight" ? "Nothing on tonight — try This Week." : "Try a different date range or category.");
    return;
  }
  $("#count").textContent = `${list.length} event${list.length > 1 ? "s" : ""}`;
  const hero = list.reduce((a, b) => (b.pop > (a?.pop ?? -1) ? b : a), null);
  const rest = hero ? list.filter(x => x !== hero) : list;
  feed.innerHTML = (hero ? heroHTML(hero) : "") + rest.map(cardHTML).join("");
}
function renderSaved() {
  const feed = $("#feed");
  const list = EVENTS.filter(e => saved.has(e.id)).sort((a, b) => new Date(a.start) - new Date(b.start));
  $("#count").textContent = list.length ? `${list.length} saved` : "";
  feed.innerHTML = list.length
    ? list.map(cardHTML).join("")
    : emptyHTML("bookmark", "No saved events", "Tap an event, then Save, to keep it here.");
}

/* ---------- detail sheet ---------- */
function openSheet(e) {
  const sh = $("#sheet");
  const isSaved = saved.has(e.id);
  sh.innerHTML = `
    <div class="grab"></div>
    <div class="hero">${imgBlock(e, 220)}</div>
    <div class="content">
      <h2>${esc(e.name)}</h2>
      <div class="rows">
        <div class="row"><div class="ic">${ic("calendar", 17)}</div><div><b>${fmtDate(e.start)}</b><span>${fmtTime(e.start)}</span></div></div>
        <div class="row"><div class="ic">${ic("pin", 17)}</div><div><b>${esc(e.venue)}</b><span>${esc(e.hood || "Miami")}</span></div></div>
        <div class="row"><div class="ic">${ic("ticket", 17)}</div><div><b>${e.free || e.priceMin === 0 ? "Free" : e.priceMin != null ? "From $" + Math.round(e.priceMin) : "See ticket page"}</b><span>via ${esc(e.src)}</span></div></div>
      </div>
      <button class="tix" id="sheetTix">Get Tickets ${ic("chevR", 16)}</button>
      <div class="btnrow">
        <button class="ghost" id="sheetSave">${ic("bookmark", 15)} ${isSaved ? "Saved" : "Save"}</button>
        <button class="ghost" id="sheetShare">${ic("share", 15)} Share</button>
      </div>
      <div class="src-note">Tickets via ${esc(e.src)} — prices may vary</div>
    </div>`;
  $("#scrim").classList.add("on");
  sh.classList.add("on");
  $("#sheetTix").onclick = ev => { ev.stopPropagation(); window.open(e.url, "_blank", "noopener"); };
  $("#sheetSave").onclick = ev => {
    ev.stopPropagation();
    saved.has(e.id) ? saved.delete(e.id) : saved.add(e.id);
    localStorage.setItem("mia-saved", JSON.stringify([...saved]));
    openSheet(e); render();
  };
  $("#sheetShare").onclick = async ev => {
    ev.stopPropagation();
    const text = `${e.name} — ${fmtDate(e.start)} at ${e.venue}: ${e.url}`;
    if (navigator.share) { try { await navigator.share({ title: e.name, text }); } catch {} }
    else { try { await navigator.clipboard.writeText(text); $("#sheetShare").innerHTML = `${ic("share", 15)} Copied`; } catch {} }
  };
}
function closeSheet() { $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); }

/* ---------- chrome wiring ---------- */
function moveThumb() {
  const btns = [...document.querySelectorAll("#seg button")];
  const on = btns.find(b => b.dataset.r === range) || btns[0];
  const th = $("#segThumb");
  th.style.left = on.offsetLeft + "px";
  th.style.width = on.offsetWidth + "px";
}
function syncSeg() {
  document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x.dataset.r === range));
  moveThumb();
}
function renderPills() {
  $("#pills").innerHTML = CATS.map(([k, l,icn]) =>
    `<button class="pill${k === cat ? " on" : ""}" data-c="${k}">${ic(icn, 15)} ${l}</button>`).join("");
}
function renderSort() {
  $("#sort").innerHTML = SORTS.map(([k, l, icn]) =>
    `<button data-s="${k}" class="${k === sortBy ? "on" : ""}">${ic(icn, 14)} ${l}</button>`).join("");
}
function setView(v) {
  view = v;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.t === v));
  document.body.classList.toggle("saved-view", v === "saved");
  render();
  window.scrollTo({ top: 0 });
}

document.addEventListener("DOMContentLoaded", () => {
  $("#dateline").textContent = "What's on · " + new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  $("#searchIc").innerHTML = ic("search", 18);
  $("#refreshBtn").innerHTML = ic("refresh", 18);
  $("#ptrSpin").innerHTML = ic("refresh", 26);
  $("#tabEvents").insertAdjacentHTML("afterbegin", ic("calendar", 23));
  $("#tabSaved").insertAdjacentHTML("afterbegin", ic("bookmark", 23));

  renderPills(); renderSort(); syncSeg();
  window.addEventListener("resize", moveThumb);

  $("#seg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    range = b.dataset.r; syncSeg(); render();
  });
  $("#pills").addEventListener("click", e => {
    const b = e.target.closest(".pill"); if (!b) return;
    cat = b.dataset.c; renderPills(); render();
  });
  $("#sort").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    sortBy = b.dataset.s; renderSort(); render();
  });
  let qT;
  $("#q").addEventListener("input", e => {
    clearTimeout(qT);
    qT = setTimeout(() => { query = e.target.value.trim(); render(); }, 220);
  });
  document.querySelectorAll(".tab").forEach(t =>
    t.addEventListener("click", () => setView(t.dataset.t)));

  $("#feed").addEventListener("click", e => {
    if (e.target.closest("#retryBtn")) { load(true); return; }
    const tix = e.target.closest("[data-tix]");
    if (tix) {
      e.stopPropagation();
      const ev = EVENTS.find(x => x.id === tix.dataset.tix);
      if (ev) window.open(ev.url, "_blank", "noopener");
      return;
    }
    const card = e.target.closest(".card");
    if (card) {
      const ev = EVENTS.find(x => x.id === card.dataset.id);
      if (ev) openSheet(ev);
    }
  });
  $("#scrim").addEventListener("click", closeSheet);

  /* visible refresh button */
  $("#refreshBtn").addEventListener("click", () => doRefresh());

  /* touch pull-to-refresh */
  const ptr = $("#ptr"), ptrSpin = $("#ptrSpin");
  let pStartY = null;
  document.addEventListener("touchstart", e => {
    if (window.scrollY <= 0 && view === "events") pStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (pStartY === null) return;
    const dy = e.touches[0].clientY - pStartY;
    if (dy > 0) {
      ptr.style.height = Math.min(dy * 0.55, 88) + "px";
      ptrSpin.style.transform = `rotate(${dy * 1.6}deg)`;
    }
  }, { passive: true });
  document.addEventListener("touchend", () => {
    if (pStartY === null) return;
    const h = parseFloat(ptr.style.height) || 0;
    pStartY = null; ptrSpin.style.transform = "";
    if (h >= 64) doRefresh();
    else ptr.style.height = "0px";
  });

  load();
});

async function doRefresh() {
  const ptr = $("#ptr"), ptrSpin = $("#ptrSpin");
  ptrSpin.classList.add("spinning");
  ptr.style.height = "56px";
  await load(true);
  ptrSpin.classList.remove("spinning");
  ptr.style.height = "0px";
}

/* ---------- load ---------- */
async function load(force) {
  if (!force && loadedOnce) { render(); return; }
  loadError = false;
  if (!loadedOnce) render(); // skeletons
  const [sg, tm] = await Promise.all([fetchSeatGeek(), fetchTM()]);
  const all = dedupe([sg.events, tm.events]).filter(e => e.start && !isNaN(new Date(e.start)));
  if ((!sg.ok && !tm.ok) || !all.length) loadError = true;
  EVENTS = all;
  loadedOnce = true;
  render();
}
</script>
