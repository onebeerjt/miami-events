<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08080c">
<title>MIAMI — What's On</title>
<style>
:root {
  --bg: #08080c;
  --glass: rgba(255,255,255,0.07);
  --glass-strong: rgba(255,255,255,0.12);
  --glass-border: rgba(255,255,255,0.14);
  --ink: #f5f5f7;
  --muted: rgba(245,245,247,0.55);
  --faint: rgba(245,245,247,0.35);
  --accent: #7d7aff;
  --accent2: #00d4ff;
  --pink: #ff5e8a;
  --green: #34e0a1;
  --amber: #ffb340;
  --spring: cubic-bezier(0.32, 0.72, 0, 1);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Inter, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100dvh;
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
/* ambient gradient mesh */
.mesh {
  position: fixed; inset: 0; z-index: -1; overflow: hidden;
  background: radial-gradient(120% 90% at 15% 0%, rgba(125,122,255,0.16), transparent 55%),
              radial-gradient(120% 100% at 90% 10%, rgba(0,212,255,0.10), transparent 50%),
              radial-gradient(140% 110% at 50% 110%, rgba(255,94,138,0.10), transparent 55%),
              var(--bg);
}
.mesh::after {
  content: ""; position: absolute; inset: -40%;
  background: conic-gradient(from 0deg at 50% 50%, transparent, rgba(125,122,255,0.05), transparent 30%);
  animation: drift 24s linear infinite;
}
@keyframes drift { to { transform: rotate(360deg); } }

.app { max-width: 560px; margin: 0 auto; padding: calc(var(--sat) + 14px) 16px calc(var(--sab) + 110px); }

/* header */
header.top { display: flex; align-items: flex-end; justify-content: space-between; padding: 6px 4px 14px; }
.brand h1 {
  font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height: 1;
  background: linear-gradient(135deg, #fff 20%, var(--accent2) 70%, var(--accent) 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.brand p { font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 500; }
.live-dot {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--green);
  background: var(--glass); border: 1px solid var(--glass-border);
  padding: 7px 12px; border-radius: 999px;
  -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
}
.live-dot i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.4; transform: scale(0.8); } }

/* search */
.search {
  display: flex; align-items: center; gap: 10px;
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: 18px;
  padding: 13px 16px; margin-bottom: 14px;
  -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8);
  box-shadow: 0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
}
.search svg { flex: none; opacity: 0.5; }
.search input {
  flex: 1; background: none; border: 0; outline: 0; color: var(--ink);
  font-size: 16px; font-weight: 500;
}
.search input::placeholder { color: var(--faint); }

/* segmented control */
.seg {
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
  border-radius: 18px; padding: 4px; margin-bottom: 12px; position: relative;
  -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
}
.seg button {
  border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 700;
  padding: 10px 0; border-radius: 14px; cursor: pointer; position: relative; z-index: 1;
  transition: color 0.25s var(--spring); font-family: inherit;
}
.seg button.on { color: #fff; }
.seg .thumb {
  position: absolute; top: 4px; bottom: 4px; border-radius: 14px; z-index: 0;
  background: linear-gradient(135deg, rgba(125,122,255,0.55), rgba(0,212,255,0.35));
  border: 1px solid rgba(255,255,255,0.22);
  box-shadow: 0 4px 20px rgba(125,122,255,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
  transition: left 0.35s var(--spring), width 0.35s var(--spring);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}

/* category pills */
.pills { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
.pills::-webkit-scrollbar { display: none; }
.pill {
  flex: none; border: 1px solid var(--glass-border); background: var(--glass);
  color: var(--muted); font-size: 13.5px; font-weight: 600; padding: 9px 16px; border-radius: 999px;
  cursor: pointer; transition: all 0.25s var(--spring); font-family: inherit; white-space: nowrap;
  -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
}
.pill:active { transform: scale(0.94); }
.pill.on {
  background: linear-gradient(135deg, rgba(125,122,255,0.4), rgba(0,212,255,0.25));
  color: #fff; border-color: rgba(125,122,255,0.5);
  box-shadow: 0 4px 18px rgba(125,122,255,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
}

/* toolbar row */
.toolbar { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 12px; }
.count { font-size: 13px; color: var(--faint); font-weight: 600; }
.sort { display: flex; gap: 6px; }
.sort button {
  border: 1px solid transparent; background: none; color: var(--faint);
  font-size: 12.5px; font-weight: 700; padding: 7px 11px; border-radius: 10px; cursor: pointer;
  font-family: inherit; transition: all 0.2s var(--spring);
}
.sort button.on { color: var(--ink); background: var(--glass); border-color: var(--glass-border); }

/* event cards */
.feed { display: grid; gap: 14px; }
.card {
  position: relative; border-radius: 24px; overflow: hidden; cursor: pointer;
  background: var(--glass); border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(28px) saturate(1.8); backdrop-filter: blur(28px) saturate(1.8);
  box-shadow: 0 12px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
  transition: transform 0.3s var(--spring), box-shadow 0.3s var(--spring);
  animation: rise 0.5s var(--spring) backwards;
}
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(0.98); } }
.card:active { transform: scale(0.97); }
.card .img { position: relative; height: 168px; overflow: hidden; background: linear-gradient(135deg, #1a1a24, #0d0d14); }
.card .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .img::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(8,8,12,0.85), transparent 55%);
}
.card .badges { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 6px; z-index: 2; }
.badge {
  font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 6px 10px; border-radius: 999px; color: #fff;
  background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.2);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.badge.hot { background: linear-gradient(135deg, rgba(255,94,138,0.85), rgba(255,94,138,0.5)); border-color: rgba(255,94,138,0.6); }
.badge.free { background: linear-gradient(135deg, rgba(52,224,161,0.85), rgba(52,224,161,0.4)); border-color: rgba(52,224,161,0.6); }
.badge.src { margin-left: auto; opacity: 0.85; text-transform: none; letter-spacing: 0; font-weight: 600; }
.card .body { padding: 14px 16px 15px; position: relative; }
.card h3 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; margin-bottom: 6px; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); font-weight: 500; }
.card .meta span { display: inline-flex; align-items: center; gap: 5px; }
.card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.price { font-size: 15px; font-weight: 800; }
.price small { font-weight: 600; color: var(--faint); font-size: 11.5px; }
.tix {
  border: 0; cursor: pointer; font-family: inherit;
  font-size: 14px; font-weight: 800; color: #fff; padding: 11px 20px; border-radius: 999px;
  background: linear-gradient(135deg, var(--accent), #5b5bf0 60%, var(--accent2));
  box-shadow: 0 6px 24px rgba(125,122,255,0.45), inset 0 1px 0 rgba(255,255,255,0.3);
  transition: transform 0.2s var(--spring), box-shadow 0.2s;
}
.tix:active { transform: scale(0.93); }

/* skeleton */
.skel { border-radius: 24px; overflow: hidden; background: var(--glass); border: 1px solid var(--glass-border); }
.skel .im { height: 168px; background: linear-gradient(100deg, rgba(255,255,255,0.04) 40%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.04) 60%); background-size: 200% 100%; animation: sh 1.4s infinite; }
.skel .ln { height: 14px; border-radius: 7px; margin: 14px 16px 0; background: rgba(255,255,255,0.07); }
.skel .ln:last-child { margin-bottom: 16px; width: 55%; }
@keyframes sh { to { background-position: -200% 0; } }

/* empty + error */
.state { text-align: center; padding: 60px 30px; color: var(--muted); }
.state .big { font-size: 44px; margin-bottom: 12px; }
.state h2 { font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
.state p { font-size: 14px; line-height: 1.5; }
.state button { margin-top: 16px; }

/* bottom nav */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  padding: 10px 20px calc(var(--sab) + 14px);
  background: rgba(12,12,18,0.6);
  -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
  border-top: 1px solid rgba(255,255,255,0.08);
}
.tabbar .row { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tab {
  border: 0; background: none; color: var(--faint); font-family: inherit; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; padding: 6px 0 2px;
  transition: color 0.2s, transform 0.2s var(--spring);
}
.tab:active { transform: scale(0.9); }
.tab.on { color: #fff; }
.tab svg { width: 23px; height: 23px; }

/* detail sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.3s; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 95; max-width: 560px; margin: 0 auto;
  max-height: 88dvh; overflow-y: auto; border-radius: 28px 28px 0 0;
  background: rgba(20,20,28,0.82); border: 1px solid var(--glass-border); border-bottom: 0;
  -webkit-backdrop-filter: blur(40px) saturate(2); backdrop-filter: blur(40px) saturate(2);
  transform: translateY(105%); transition: transform 0.45s var(--spring);
  box-shadow: 0 -20px 80px rgba(0,0,0,0.6);
  padding-bottom: calc(var(--sab) + 24px);
}
.sheet.on { transform: translateY(0); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.25); margin: 10px auto 0; }
.sheet .hero { height: 220px; position: relative; margin: 12px 16px 0; border-radius: 20px; overflow: hidden; }
.sheet .hero img { width: 100%; height: 100%; object-fit: cover; }
.sheet .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,8,12,0.9), transparent 60%); }
.sheet .content { padding: 16px 22px 0; }
.sheet h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 10px; }
.sheet .rows { display: grid; gap: 10px; margin: 14px 0 18px; }
.sheet .row { display: flex; gap: 12px; align-items: flex-start; font-size: 14.5px; }
.sheet .row .ic { flex: none; width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--glass-border); font-size: 16px; }
.sheet .row b { display: block; font-weight: 700; }
.sheet .row span { color: var(--muted); font-size: 13px; }
.sheet .tix { width: 100%; padding: 16px; font-size: 16px; border-radius: 18px; }
.sheet .src-note { text-align: center; font-size: 12px; color: var(--faint); margin-top: 10px; }
</style>
</head>
<body>
<div class="mesh"></div>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>MIAMI</h1>
      <p id="dateline">What's on</p>
    </div>
    <div class="live-dot"><i></i><span id="liveCount">···</span></div>
  </header>

  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search events, venues, artists…" autocomplete="off">
  </div>

  <div class="seg" id="seg">
    <div class="thumb" id="segThumb"></div>
    <button data-r="tonight" class="on">Tonight</button>
    <button data-r="weekend">Weekend</button>
    <button data-r="week">This Week</button>
  </div>

  <div class="pills" id="pills"></div>

  <div class="toolbar">
    <div class="count" id="count"></div>
    <div class="sort" id="sort">
      <button data-s="pop" class="on">🔥 Hot</button>
      <button data-s="date">🗓 Date</button>
      <button data-s="price">💲 Price</button>
    </div>
  </div>

  <div class="feed" id="feed"></div>
</div>

<nav class="tabbar"><div class="row">
  <button class="tab on" data-t="events">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    EVENTS
  </button>
  <button class="tab" data-t="tonight">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3.5"/></svg>
    TONIGHT
  </button>
  <button class="tab" data-t="saved">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-4-7 4V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
    SAVED
  </button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>

<script>
"use strict";
/* ---------- config ---------- */
const SG_ID = "MzA2MzY2NDN8MTc5MTI5NDQwOC42NDM0NDIy";
const TM_KEY = "uaLYEAl0NOFUZNwq1Dzr7cVoxF8zFVOv";
const LAT = 25.7617, LON = -80.1918;

/* ---------- state ---------- */
let EVENTS = [];
let range = "tonight", cat = "all", sortBy = "pop", query = "";
let saved = new Set(JSON.parse(localStorage.getItem("mia-saved") || "[]"));
const CATS = [
  ["all", "✨ All"], ["music", "🎵 Music"], ["sports", "🏟 Sports"],
  ["arts", "🎭 Arts"], ["nightlife", "🌙 Nightlife"], ["free", "🆓 Free"]
];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => {
  const d = new Date(iso);
  return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
};
const fmtTime = iso => {
  const d = new Date(iso);
  return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
};
const dayStart = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const inRange = (iso, r) => {
  const now = new Date(), t = new Date(iso);
  if (t < dayStart(now)) return false;
  if (r === "tonight") return t < new Date(dayStart(now).getTime() + 864e5);
  const dow = now.getDay(); // 0 Sun
  if (r === "weekend") {
    const fri = new Date(dayStart(now).getTime() + ((5 - dow + 7) % 7) * 864e5);
    const mon = new Date(fri.getTime() + 3 * 864e5);
    return t >= fri && t < mon;
  }
  return t < new Date(dayStart(now).getTime() + 7 * 864e5); // week
};
const hood = venue => {
  const v = (venue || "").toLowerCase();
  if (/wynwood|oasis/.test(v)) return "Wynwood";
  if (/south beach|sobes|miami beach|fillmore/.test(v)) return "Miami Beach";
  if (/downtown|kaseya|bayfront|frost/.test(v)) return "Downtown";
  if (/brickell/.test(v)) return "Brickell";
  if (/coconut grove|grove/.test(v)) return "Coconut Grove";
  if (/coral gables/.test(v)) return "Coral Gables";
  if (/doral/.test(v)) return "Doral";
  if (/hialeah/.test(v)) return "Hialeah";
  if (/hard rock|miami gardens/.test(v)) return "Miami Gardens";
  if (/little havana|calle ocho/.test(v)) return "Little Havana";
  if (/aventura/.test(v)) return "Aventura";
  if (/dadeland|kendall/.test(v)) return "Kendall";
  return "";
};

/* ---------- fetch: SeatGeek ---------- */
async function fetchSeatGeek() {
  const out = [];
  try {
    const url = `https://api.seatgeek.com/2/events?client_id=${SG_ID}&lat=${LAT}&lon=${LON}&range=50mi&per_page=100&sort=score.desc`;
    const r = await fetch(url);
    const j = await r.json();
    for (const e of j.events || []) {
      const v = e.venue || {};
      const perf = (e.performers || [])[0] || {};
      out.push({
        id: "sg-" + e.id,
        name: e.title || e.short_title,
        venue: v.name || "",
        hood: hood(v.name + " " + (v.address || "") + " " + (v.city || "")),
        start: e.datetime_utc,
        img: perf.image || e.image || "",
        priceMin: e.stats?.lowest_price ?? null,
        priceMax: e.stats?.highest_price ?? null,
        url: e.url,
        src: "SeatGeek",
        pop: e.score || 0,
        cats: classify(e.title + " " + (e.taxonomies?.map(t=>t.name).join(" ") || "")),
        free: (e.stats?.lowest_price ?? 999) === 0
      });
    }
  } catch (err) { console.warn("SeatGeek failed", err); }
  return out;
}

/* ---------- fetch: Ticketmaster ---------- */
async function fetchTM() {
  const out = [];
  try {
    const url = `https://app.ticketmaster.com/discovery/v2/events.json?apikey=${TM_KEY}&latlong=${LAT},${LON}&radius=50&unit=miles&size=100&sort=date,asc`;
    const r = await fetch(url);
    const j = await r.json();
    for (const e of (j._embedded?.events) || []) {
      const v = e._embedded?.venues?.[0] || {};
      const pr = e.priceRanges?.[0];
      const img = (e.images || []).sort((a,b) => (b.width||0) - (a.width||0))[0];
      out.push({
        id: "tm-" + e.id,
        name: e.name,
        venue: v.name || "",
        hood: hood(v.name + " " + (v.address?.line1 || "") + " " + (v.city?.name || "")),
        start: e.dates?.start?.dateTime,
        img: img?.url || "",
        priceMin: pr?.min ?? null,
        priceMax: pr?.max ?? null,
        url: e.url,
        src: "Ticketmaster",
        pop: 0.5,
        cats: classify(e.name + " " + (e.classifications?.map(c => [c.segment?.name, c.genre?.name].join(" ")).join(" ") || "")),
        free: false
      });
    }
  } catch (err) { console.warn("Ticketmaster failed", err); }
  return out;
}

function classify(text) {
  const t = text.toLowerCase();
  const c = new Set();
  if (/concert|music|band|dj|tour|festival|singer|rapper|orchestra|jazz|symphony/.test(t)) c.add("music");
  if (/game|match|vs\.|championship|tournament|fight|ufc|marathon|race|derby|heat|dolphins|marlins|inter miami/.test(t)) c.add("sports");
  if (/theater|theatre|musical|opera|ballet|comedy|show|art|gallery|museum|exhibit/.test(t)) c.add("arts");
  if (/club|party|rooftop|late night|after hours|boat/.test(t)) c.add("nightlife");
  if (!c.size) c.add("music");
  return [...c];
}

/* ---------- dedupe ---------- */
function dedupe(lists) {
  const seen = new Map();
  for (const e of lists.flat()) {
    if (!e.start) continue;
    const key = (e.name || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 24)
      + "|" + new Date(e.start).toISOString().slice(0, 10);
    const cur = seen.get(key);
    if (!cur || (e.pop > cur.pop)) seen.set(key, e);
  }
  return [...seen.values()];
}

/* ---------- render ---------- */
function priceStr(e) {
  if (e.free || e.priceMin === 0) return `<span style="color:var(--green)">FREE</span>`;
  if (e.priceMin == null) return `<small>See prices</small>`;
  const p = "$" + Math.round(e.priceMin);
  return e.priceMax && e.priceMax > e.priceMin ? `${p}<small> – $${Math.round(e.priceMax)}</small>` : p;
}

function cardHTML(e, i) {
  const hot = e.pop > 0.75 ? `<span class="badge hot">🔥 Hot</span>` : "";
  const free = (e.free || e.priceMin === 0) ? `<span class="badge free">Free</span>` : "";
  const isSaved = saved.has(e.id) ? "🔖" : "";
  return `
  <article class="card" data-id="${esc(e.id)}" style="animation-delay:${Math.min(i * 40, 400)}ms">
    <div class="img">
      ${e.img ? `<img src="${esc(e.img)}" loading="lazy" alt="">` : ""}
      <div class="badges">${hot}${free}<span class="badge src">${esc(e.src)}${isSaved ? " · " + isSaved : ""}</span></div>
    </div>
    <div class="body">
      <h3>${esc(e.name)}</h3>
      <div class="meta">
        <span>📍 ${esc(e.venue)}${e.hood ? " · " + esc(e.hood) : ""}</span>
        <span>🗓 ${fmtDate(e.start)} · ${fmtTime(e.start)}</span>
      </div>
      <div class="foot">
        <div class="price">${priceStr(e)}</div>
        <button class="tix" data-tix="${esc(e.id)}">Get Tickets</button>
      </div>
    </div>
  </article>`;
}

function filtered() {
  let list = EVENTS.filter(e => inRange(e.start, range));
  if (cat !== "all") list = list.filter(e => cat === "free" ? (e.free || e.priceMin === 0) : e.cats.includes(cat));
  if (query) {
    const q = query.toLowerCase();
    list = list.filter(e => (e.name + " " + e.venue).toLowerCase().includes(q));
  }
  const by = {
    pop: (a,b) => b.pop - a.pop,
    date: (a,b) => new Date(a.start) - new Date(b.start),
    price: (a,b) => (a.priceMin ?? 1e9) - (b.priceMin ?? 1e9)
  }[sortBy];
  return list.sort(by);
}

function render() {
  const list = filtered();
  const feed = $("#feed");
  $("#count").textContent = list.length ? `${list.length} event${list.length > 1 ? "s" : ""}` : "";
  $("#liveCount").textContent = EVENTS.filter(e => inRange(e.start, "tonight")).length + " tonight";
  if (!EVENTS.length) {
    feed.innerHTML = Array.from({length: 4}, () =>
      `<div class="skel"><div class="im"></div><div class="ln"></div><div class="ln"></div></div>`).join("");
    return;
  }
  if (!list.length) {
    feed.innerHTML = `<div class="state"><div class="big">🌴</div><h2>Nothing here</h2><p>Try a different date range or category.</p></div>`;
    return;
  }
  feed.innerHTML = list.map(cardHTML).join("");
}

/* ---------- detail sheet ---------- */
function openSheet(e) {
  const sh = $("#sheet");
  const isSaved = saved.has(e.id);
  sh.innerHTML = `
    <div class="grab"></div>
    <div class="hero">${e.img ? `<img src="${esc(e.img)}" alt="">` : ""}</div>
    <div class="content">
      <h2>${esc(e.name)}</h2>
      <div class="rows">
        <div class="row"><div class="ic">🗓</div><div><b>${fmtDate(e.start)}</b><span>${fmtTime(e.start)}</span></div></div>
        <div class="row"><div class="ic">📍</div><div><b>${esc(e.venue)}</b><span>${esc(e.hood || "Miami")}</span></div></div>
        <div class="row"><div class="ic">💲</div><div><b>${e.free || e.priceMin === 0 ? "Free" : e.priceMin != null ? "From $" + Math.round(e.priceMin) : "See ticket page"}</b><span>via ${esc(e.src)}</span></div></div>
      </div>
      <button class="tix" id="sheetTix">Get Tickets →</button>
      <div style="display:flex;gap:10px;margin-top:10px">
        <button class="tix" id="sheetSave" style="flex:1;background:linear-gradient(135deg,rgba(255,255,255,0.16),rgba(255,255,255,0.06));box-shadow:none;border:1px solid var(--glass-border)">${isSaved ? "🔖 Saved" : "☆ Save"}</button>
        <button class="tix" id="sheetShare" style="flex:1;background:linear-gradient(135deg,rgba(255,255,255,0.16),rgba(255,255,255,0.06));box-shadow:none;border:1px solid var(--glass-border)">⤴ Share</button>
      </div>
      <div class="src-note">Tickets via ${esc(e.src)} — prices may vary</div>
    </div>`;
  $("#scrim").classList.add("on");
  sh.classList.add("on");
  $("#sheetTix").onclick = ev => { ev.stopPropagation(); window.open(e.url, "_blank", "noopener"); };
  $("#sheetSave").onclick = ev => {
    ev.stopPropagation();
    saved.has(e.id) ? saved.delete(e.id) : saved.add(e.id);
    localStorage.setItem("mia-saved", JSON.stringify([...saved]));
    openSheet(e); render();
  };
  $("#sheetShare").onclick = async ev => {
    ev.stopPropagation();
    const text = `${e.name} — ${fmtDate(e.start)} at ${e.venue} 🎟 ${e.url}`;
    if (navigator.share) { try { await navigator.share({ title: e.name, text }); } catch {} }
    else { try { await navigator.clipboard.writeText(text); $("#sheetShare").textContent = "✓ Copied"; } catch {} }
  };
}
function closeSheet() { $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); }

/* ---------- events wiring ---------- */
function moveThumb() {
  const btns = [...document.querySelectorAll("#seg button")];
  const on = btns.find(b => b.dataset.r === range);
  const th = $("#segThumb");
  th.style.left = on.offsetLeft + "px";
  th.style.width = on.offsetWidth + "px";
}
function renderPills() {
  $("#pills").innerHTML = CATS.map(([k, l]) =>
    `<button class="pill${k === cat ? " on" : ""}" data-c="${k}">${l}</button>`).join("");
}

document.addEventListener("DOMContentLoaded", () => {
  // dateline
  $("#dateline").textContent = "What's on · " + new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });

  renderPills();
  moveThumb();
  window.addEventListener("resize", moveThumb);

  $("#seg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    range = b.dataset.r;
    document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x === b));
    moveThumb(); render();
  });
  $("#pills").addEventListener("click", e => {
    const b = e.target.closest(".pill"); if (!b) return;
    cat = b.dataset.c; renderPills(); render();
  });
  $("#sort").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    sortBy = b.dataset.s;
    document.querySelectorAll("#sort button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  let qT;
  $("#q").addEventListener("input", e => {
    clearTimeout(qT);
    qT = setTimeout(() => { query = e.target.value.trim(); render(); }, 220);
  });
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    const v = t.dataset.t;
    if (v === "tonight") { range = "tonight"; syncSeg(); }
    else if (v === "saved") {
      const list = EVENTS.filter(e => saved.has(e.id));
      $("#feed").innerHTML = list.length ? list.map(cardHTML).join("")
        : `<div class="state"><div class="big">🔖</div><h2>No saved events</h2><p>Tap an event and hit Save to keep it here.</p></div>`;
      $("#count").textContent = list.length ? `${list.length} saved` : "";
      return;
    }
    render();
  }));
  function syncSeg() {
    document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x.dataset.r === range));
    moveThumb();
  }

  $("#feed").addEventListener("click", e => {
    const tix = e.target.closest("[data-tix]");
    if (tix) {
      e.stopPropagation();
      const ev = EVENTS.find(x => x.id === tix.dataset.tix);
      if (ev) window.open(ev.url, "_blank", "noopener");
      return;
    }
    const card = e.target.closest(".card");
    if (card) {
      const ev = EVENTS.find(x => x.id === card.dataset.id);
      if (ev) openSheet(ev);
    }
  });
  $("#scrim").addEventListener("click", closeSheet);

  // pull-to-refresh-ish: double-tap header
  let lastTap = 0;
  document.querySelector("header.top").addEventListener("click", () => {
    const n = Date.now();
    if (n - lastTap < 350) load(true);
    lastTap = n;
  });

  load();
});

/* ---------- load ---------- */
async function load(force) {
  if (!force && EVENTS.length) { render(); return; }
  render(); // skeletons
  const [sg, tm] = await Promise.all([fetchSeatGeek(), fetchTM()]);
  EVENTS = dedupe([sg, tm]).filter(e => e.start && !isNaN(new Date(e.start)));
  // default to weekend if it's Thu/Fri
  const dow = new Date().getDay();
  if ((dow === 4 || dow === 5) && range === "tonight") {
    range = "weekend";
    document.querySelectorAll("#seg button").forEach(x => x.classList.toggle("on", x.dataset.r === range));
    moveThumb();
  }
  render();
}
</script>
</body>
</html>
